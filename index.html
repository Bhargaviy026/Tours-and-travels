<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhargavi Tours &amp; Travels | Hyderabad – Pilgrimage, Srisailam &amp; City Tours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --navy-950: #071529;
        --navy-900: #0b1f3a;
        --navy-800: #122d54;
        --navy-700: #1b4175;
        --gold-500: #f4b400;
        --gold-400: #ffd15c;
        --gold-600: #d99b00;
        --sky-500: #2ea3dd;
        --sky-600: #1b88bf;
        --sky-100: #e6f6fd;
        --whatsapp: #22c55e;
        --whatsapp-dark: #16a34a;
        --instagram: linear-gradient(135deg, #f58529 0%, #dd2a7b 50%, #8134af 100%);
        --forest-dark: #102a1f;
        --white: #ffffff;
        --bg-light: #f8fafc;
        --bg-tinted: #f1f5f9;
        --text-main: #0f172a;
        --text-muted: #475569;
        --border-light: #e2e8f0;
        --shadow-sm: 0 6px 18px rgba(11, 31, 58, 0.06);
        --shadow-md: 0 12px 30px rgba(11, 31, 58, 0.1);
        --shadow-lg: 0 20px 44px rgba(11, 31, 58, 0.16);
        --radius-md: 14px;
        --radius-lg: 20px;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: var(--text-main);
        background-color: var(--white);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      img { display: block; max-width: 100%; }
      a { text-decoration: none; color: inherit; }
      button { font-family: inherit; cursor: pointer; }
      h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
      .container { width: min(1240px, 92%); margin: 0 auto; }
      .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
      .main-content { flex: 1; }

      .scroll-anchor {
        scroll-margin-top: 112px;
      }

      /* HEADER & NAV */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: var(--white);
        box-shadow: 0 4px 20px rgba(11, 31, 58, 0.08);
      }
      .top-utility-bar {
        background: var(--navy-900);
        color: #e2e8f0;
        font-size: 0.82rem;
        padding: 7px 0;
      }
      .top-utility-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .utility-links { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      .utility-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--gold-400);
        font-weight: 600;
      }
      .utility-whatsapp { color: #86efac; }
      .utility-instagram { color: #f9a8d4; }
      .main-navbar { background: var(--white); border-bottom: 1px solid var(--border-light); }
      .navbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 12px 0;
      }

      /* WEB PAGE TITLE NAME (ENLARGED MODERN FONT, NO LOGO) */
      .brand-wordmark {
        display: inline-flex;
        flex-direction: column;
        cursor: pointer;
        line-height: 1.08;
      }
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 2.05rem;
        letter-spacing: 0.03em;
        color: var(--navy-900);
      }
      .brand-subtitle {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 0.92rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: var(--gold-600);
        margin-top: 2px;
      }
      .site-footer .brand-title { color: var(--white); font-size: 1.75rem; }
      .site-footer .brand-subtitle { color: var(--gold-400); font-size: 0.86rem; }

      .nav-links-desktop {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 0;
        padding: 0;
      }
      .nav-link-anchor {
        display: inline-block;
        padding: 9px 14px;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--navy-900);
        border-radius: 10px;
        transition: color 0.2s ease, background-color 0.2s ease;
      }
      .nav-link-anchor:hover, .nav-link-anchor.active {
        color: var(--sky-600);
        background: var(--sky-100);
      }
      .navbar-actions { display: flex; align-items: center; gap: 12px; }
      .nav-book-now-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--sky-500);
        color: var(--white);
        padding: 11px 22px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.95rem;
        box-shadow: 0 6px 16px rgba(46, 163, 221, 0.35);
        transition: transform 0.2s ease, background-color 0.2s ease;
      }
      .nav-book-now-btn:hover { background: var(--sky-600); transform: translateY(-2px); }
      .mobile-menu-toggle {
        display: none;
        background: var(--bg-tinted);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        padding: 8px;
        color: var(--navy-900);
      }
      .mobile-nav-drawer {
        display: none;
        background: var(--white);
        border-top: 1px solid var(--border-light);
        padding: 14px 4%;
      }
      .mobile-nav-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .mobile-nav-anchor {
        display: block;
        width: 100%;
        padding: 12px 14px;
        font-size: 1rem;
        font-weight: 700;
        color: var(--navy-900);
        border-radius: 10px;
      }
      .mobile-nav-anchor.active { background: var(--sky-100); color: var(--sky-600); }
      .mobile-drawer-cta { margin-top: 12px; }

      /* BUTTONS */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.94rem;
        border: 2px solid transparent;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn-lg { padding: 14px 28px; font-size: 1rem; }
      .btn-book-lg { padding: 13px 28px; font-size: 1rem; }
      .full-width { width: 100%; }
      .btn-sky { background: var(--sky-500); color: var(--white); box-shadow: 0 6px 16px rgba(46, 163, 221, 0.28); }
      .btn-sky:hover { background: var(--sky-600); }
      .btn-navy { background: var(--navy-900); color: var(--white); }
      .btn-navy:hover { background: var(--navy-800); }
      .btn-gold { background: var(--gold-500); color: var(--navy-950); box-shadow: 0 6px 18px rgba(244, 180, 0, 0.35); }
      .btn-gold:hover { background: var(--gold-400); }
      .btn-whatsapp { background: var(--whatsapp); color: var(--white); box-shadow: 0 6px 16px rgba(34, 197, 94, 0.28); }
      .btn-whatsapp:hover { background: var(--whatsapp-dark); }
      .btn-instagram { background: var(--instagram); color: var(--white); box-shadow: 0 6px 16px rgba(221, 42, 123, 0.3); }
      .btn-pill-dark {
        background: var(--forest-dark);
        color: var(--white);
        border-radius: 999px;
        padding: 13px 26px;
        letter-spacing: 0.03em;
        box-shadow: var(--shadow-md);
      }
      .btn-pill-dark:hover { background: var(--navy-900); }
      .btn-pill-whatsapp {
        background: var(--whatsapp);
        color: var(--white);
        border-radius: 999px;
        padding: 13px 26px;
        letter-spacing: 0.03em;
        box-shadow: 0 8px 22px rgba(34, 197, 94, 0.35);
      }
      .btn-pill-whatsapp:hover { background: var(--whatsapp-dark); }
      .btn-outline-dark { background: transparent; color: var(--text-main); border-color: var(--border-light); }
      .pill-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
      }
      .pill-call { background: var(--forest-dark); color: var(--white); border: 1px solid rgba(255,255,255,0.16); }
      .pill-whatsapp { background: var(--whatsapp); color: var(--white); }
      .pill-instagram { background: var(--instagram); color: var(--white); }

      /* HERO & SECTION BANNERS */
      .hero-section {
        position: relative;
        min-height: 600px;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        padding: 76px 0;
        color: var(--white);
      }
      .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, rgba(7,21,41,0.92) 0%, rgba(11,31,58,0.8) 55%, rgba(11,31,58,0.52) 100%);
      }
      .hero-content { position: relative; z-index: 2; max-width: 820px; }
      .hero-title {
        font-family: 'Playfair Display', serif;
        font-size: clamp(2.15rem, 4.8vw, 3.6rem);
        font-weight: 800;
        margin-bottom: 14px;
        color: var(--white);
      }
      .hero-subtitle { font-size: clamp(1.1rem, 2.2vw, 1.38rem); font-weight: 700; color: var(--gold-400); margin: 0 0 16px; }
      .hero-description { font-size: 1.05rem; color: #e2e8f0; max-width: 680px; margin: 0 0 28px; }
      .hero-cta-group { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 34px; }
      .hero-trust-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(110px, 1fr));
        gap: 14px;
        max-width: 640px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: var(--radius-md);
        padding: 16px 20px;
      }
      .trust-item { display: flex; flex-direction: column; }
      .trust-item strong { font-size: 1.45rem; color: var(--gold-400); }
      .trust-item span { font-size: 0.8rem; color: #e2e8f0; }

      .section-hero-band {
        position: relative;
        min-height: 250px;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        padding: 54px 0;
        color: var(--white);
      }
      .section-hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(95deg, rgba(7,21,41,0.92) 0%, rgba(11,31,58,0.74) 65%, rgba(11,31,58,0.55) 100%);
      }
      .section-hero-content { position: relative; z-index: 2; max-width: 820px; }
      .section-hero-content h2 { font-family: 'Playfair Display', serif; font-size: clamp(1.9rem, 4vw, 2.8rem); margin-bottom: 12px; color: var(--white); }
      .section-hero-content p { font-size: 1.04rem; color: #e2e8f0; margin: 0; }

      .srisailam-band-hero, .contact-band-hero {
        background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 65%, var(--sky-600) 100%);
        color: var(--white);
        padding: 54px 0;
        text-align: center;
      }
      .srisailam-band-hero h2, .contact-band-hero h2 { font-family: 'Playfair Display', serif; font-size: clamp(1.9rem, 4vw, 2.8rem); margin-bottom: 12px; color: var(--white); }
      .srisailam-band-hero p, .contact-band-hero p { max-width: 760px; margin: 0 auto; color: #e2e8f0; font-size: 1.04rem; }

      /* SECTIONS */
      .section { padding: 68px 0; }
      .section-light { background: var(--white); }
      .section-tinted { background: var(--bg-tinted); }
      .section-navy-band { background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 100%); color: var(--white); }
      .section-eyebrow {
        display: inline-block;
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--sky-600);
        margin-bottom: 8px;
      }
      .section-eyebrow.gold { color: var(--gold-400); }
      .section-title { font-family: 'Playfair Display', serif; font-size: clamp(1.75rem, 3.2vw, 2.45rem); color: var(--navy-900); margin-bottom: 12px; }
      .section-title.white { color: var(--white); }
      .section-subtitle { color: var(--text-muted); max-width: 680px; margin: 0 auto; font-size: 1.02rem; }
      .section-subtitle.light { color: #cbd5e1; }
      .section-header-center { text-align: center; margin-bottom: 40px; }
      .body-text { color: var(--text-muted); margin: 0 0 16px; font-size: 1.01rem; }
      .inline-btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
      .inline-phone-link { color: var(--sky-600); font-weight: 800; }

      /* WELCOME & WA */
      .welcome-split { display: grid; grid-template-columns: 1.25fr 1fr; gap: 36px; align-items: center; }
      .section-lead { font-size: 1.08rem; font-weight: 600; color: var(--navy-800); margin: 0 0 14px; }
      .instant-wa-card {
        background: var(--forest-dark);
        color: var(--white);
        border-radius: var(--radius-lg);
        padding: 28px;
        border: 1px solid rgba(212, 175, 55, 0.35);
        box-shadow: var(--shadow-lg);
      }
      .instant-wa-header { display: flex; align-items: center; gap: 10px; color: #e6c677; font-weight: 800; letter-spacing: 0.06em; font-size: 0.92rem; margin-bottom: 12px; }
      .instant-wa-card p { margin: 0 0 20px; color: #e2e8f0; font-size: 0.98rem; }
      .instant-wa-gold-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        background: #d8b56c;
        color: #0b1f16;
        padding: 14px 20px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 0.95rem;
      }
      .instant-call-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

      /* WHY & SERVICES */
      .why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
      .why-card {
        background: var(--white);
        border-radius: var(--radius-md);
        padding: 26px;
        box-shadow: var(--shadow-sm);
        border-top: 4px solid var(--sky-500);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .why-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
      .why-icon-badge {
        width: 54px; height: 54px; border-radius: 14px;
        background: var(--sky-100); color: var(--navy-900);
        display: grid; place-items: center; margin-bottom: 16px;
      }
      .why-card h3 { font-size: 1.15rem; color: var(--navy-900); margin-bottom: 8px; }
      .why-card p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }

      .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
      .service-card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--radius-md);
        padding: 24px;
        display: flex;
        flex-direction: column;
      }
      .service-badge {
        align-self: flex-start;
        background: var(--gold-500);
        color: var(--navy-950);
        font-size: 0.74rem;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
      .service-card h3 { color: var(--white); font-size: 1.15rem; margin-bottom: 10px; }
      .service-card p { color: #cbd5e1; font-size: 0.94rem; margin: 0 0 18px; flex: 1; }
      .service-link { display: inline-flex; align-items: center; gap: 7px; color: var(--gold-400); font-weight: 700; font-size: 0.88rem; }

      /* ABOUT */
      .about-who-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 44px; align-items: center; }
      .emphasis-quote { font-weight: 800; color: var(--navy-900); font-size: 1.1rem; border-left: 4px solid var(--gold-500); padding-left: 14px; }
      .about-visual-collage { position: relative; }
      .collage-main-img { width: 100%; height: 380px; object-fit: cover; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
      .about-pillars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 44px; }
      .pillar-card { background: var(--bg-light); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 26px; border-bottom: 4px solid var(--gold-500); }
      .pillar-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--navy-900); color: var(--gold-400); display: grid; place-items: center; margin-bottom: 14px; }
      .pillar-card h3 { font-size: 1.2rem; color: var(--navy-900); margin-bottom: 8px; }
      .pillar-card p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }

      /* SRISAILAM PACKAGES */
      .package-split-layout { display: grid; grid-template-columns: 1.05fr 1fr; gap: 44px; align-items: center; }
      .package-media-box { border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-lg); background: var(--navy-900); }
      .package-media-box img { width: 100%; height: 430px; object-fit: cover; }
      .package-tag { display: inline-block; background: var(--sky-100); color: var(--sky-600); font-weight: 800; font-size: 0.8rem; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; }
      .package-tag.gold { background: rgba(244, 180, 0, 0.2); color: #996c00; }
      .package-details-box h3 { font-family: 'Playfair Display', serif; font-size: clamp(1.85rem, 3.2vw, 2.5rem); color: var(--navy-900); margin-bottom: 12px; }
      .package-intro { color: var(--text-muted); margin: 0 0 20px; }
      .package-places-list { list-style: none; margin: 0 0 26px; padding: 0; display: grid; gap: 10px; }
      .package-places-list.two-col-on-wide { grid-template-columns: repeat(2, 1fr); gap: 10px 18px; }
      .package-places-list li { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--navy-900); font-size: 0.98rem; }
      .check-bullet { color: var(--sky-500); flex-shrink: 0; }
      .package-cta-row { display: flex; flex-wrap: wrap; gap: 14px; }

      /* FLEET & DESTINATION CARDS */
      .cards-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
      .cards-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
      .fleet-card, .destination-card {
        background: var(--white);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-light);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .fleet-card { text-align: center; }
      .fleet-card:hover, .destination-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
      .fleet-card-image-wrap, .destination-card-media { position: relative; height: 215px; overflow: hidden; background: var(--navy-900); }
      .fleet-card-image-wrap { background: #e2e8f0; }
      .fleet-card-image-wrap img, .destination-card-media img { width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform 0.35s ease; }
      .fleet-card:hover img, .destination-card:hover img { transform: scale(1.06); }
      .fleet-category-pill { position: absolute; top: 12px; right: 12px; background: var(--navy-900); color: var(--gold-400); font-size: 0.74rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
      .fleet-card-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
      .fleet-card-title { font-size: 1.2rem; font-weight: 800; color: var(--navy-900); margin-bottom: 8px; }
      .fleet-card-meta { display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--sky-600); font-weight: 700; font-size: 0.88rem; margin: 0 0 6px; }
      .fleet-card-features { color: var(--text-muted); font-size: 0.88rem; margin: 0 0 18px; flex: 1; }
      .destination-badge {
        position: absolute; bottom: 10px; left: 10px;
        background: rgba(11, 31, 58, 0.85); color: var(--gold-400);
        font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
        max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .destination-card-body { padding: 18px; display: flex; flex-direction: column; flex: 1; }
      .destination-card-title { font-size: 1.08rem; font-weight: 800; color: var(--navy-900); text-align: center; margin-bottom: 8px; }
      .destination-card-subtitle { display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--text-muted); font-size: 0.84rem; margin: 0 0 14px; text-align: center; }
      .destination-card-desc { color: var(--text-muted); font-size: 0.88rem; margin: 0 0 16px; flex: 1; text-align: center; }
      .destination-card-actions { display: flex; gap: 8px; margin-top: auto; }
      .card-book-btn {
        flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: var(--sky-500); color: var(--white); font-weight: 700; font-size: 0.92rem;
        padding: 11px 16px; border-radius: 8px;
      }
      .card-book-btn:hover { background: var(--sky-600); }
      .card-wa-btn {
